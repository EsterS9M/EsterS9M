<svg xmlns="http://www.w3.org/2000/svg" width="300" height="240" viewBox="0 0 300 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f26"/>
      <stop offset="1" stop-color="#22123f"/>
    </linearGradient>
    <filter id="neon" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="284" height="224" rx="20" fill="url(#bg)"/>
  <rect x="8" y="8" width="284" height="224" rx="20" fill="none" stroke="#8b5cf6" stroke-width="2.5" filter="url(#neon)"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#c4b5fd">
    <text x="32" y="58">Se você faz</text>
    <text x="32" y="86">a mesma coisa</text>
    <text x="32" y="114">todo dia,</text>
    <text x="32" y="142" fill="#f0abfc">automatiza.</text>
  </g>
  <rect x="32" y="162" width="70" height="4" rx="2" fill="#8b5cf6"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8f7fc0" letter-spacing="1">
    <text x="32" y="188">MENOS CLIQUES.</text>
    <text x="32" y="204">MAIS TEMPO.</text>
  </g>
  <text x="252" y="210" font-family="Consolas, monospace" font-size="15" fill="#a78bfa">&lt;/&gt;</text>
</svg>
