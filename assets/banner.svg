<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a1a"/>
      <stop offset="0.55" stop-color="#160f2e"/>
      <stop offset="1" stop-color="#241046"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.4">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1435"/>
      <stop offset="1" stop-color="#110c24"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="22" fill="url(#glow)"/>
  <rect width="1200" height="380" rx="22" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#8b5cf6" stroke-opacity="0.35"/>

  <!-- estrelinhas -->
  <g fill="#e9d5ff">
    <circle cx="620" cy="40" r="1.6" opacity=".8"/><circle cx="700" cy="330" r="1.2" opacity=".6"/>
    <circle cx="560" cy="300" r="1.4" opacity=".5"/><circle cx="1150" cy="60" r="1.5" opacity=".7"/>
    <circle cx="480" cy="70" r="1.1" opacity=".5"/><circle cx="1120" cy="340" r="1.3" opacity=".6"/>
  </g>

  <!-- comando de terminal no topo -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#a78bfa" opacity=".75">
    <text x="64" y="64">&gt; ester.init()</text>
    <text x="64" y="84" fill="#6d5aa8">loading: python · regex · selenium...</text>
  </g>

  <!-- nome -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800">
    <text x="60" y="178" font-size="78" fill="#f5f3ff" letter-spacing="-1">ester<tspan fill="url(#txt)" filter="url(#neon)">.dev</tspan></text>
  </g>

  <!-- BUILD > AUTOMATE > LEARN -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" letter-spacing="5" fill="#c4b5fd">
    <text x="64" y="214">BUILD <tspan fill="#ec4899">›</tspan> AUTOMATE <tspan fill="#ec4899">›</tspan> LEARN</text>
  </g>

  <!-- frase -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#cbc3e3">
    <text x="64" y="256">Transformando tarefas repetitivas em automações</text>
    <text x="64" y="280">e aprendendo um pouco mais a cada commit.</text>
  </g>

  <!-- selo -->
  <g transform="translate(64 304)">
    <rect width="276" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <circle cx="22" cy="18" r="5" fill="#4ade80" filter="url(#neon)"/>
    <text x="38" y="23" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#e9d5ff">automatizando com python</text>
  </g>

  <!-- ===== monitor ===== -->
  <g transform="translate(700 70)">
    <ellipse cx="200" cy="230" rx="230" ry="40" fill="#8b5cf6" opacity=".35" filter="url(#soft)"/>
    <!-- base -->
    <rect x="170" y="205" width="60" height="26" rx="4" fill="#2a2148"/>
    <rect x="120" y="228" width="160" height="10" rx="5" fill="#3a2d63"/>
    <!-- tela -->
    <rect x="0" y="0" width="400" height="210" rx="16" fill="#2a2148"/>
    <rect x="10" y="10" width="380" height="190" rx="10" fill="url(#screen)" stroke="#8b5cf6" stroke-opacity=".5"/>
    <!-- bolinhas da janela -->
    <circle cx="28" cy="28" r="5" fill="#f472b6"/><circle cx="44" cy="28" r="5" fill="#facc15"/><circle cx="60" cy="28" r="5" fill="#4ade80"/>
    <text x="300" y="32" font-family="Consolas, monospace" font-size="11" fill="#7c6bb0">robo.py</text>
    <!-- código -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="13">
      <text x="28" y="62" fill="#7c6bb0"># lê o Word e preenche o formulário</text>
      <text x="28" y="84"><tspan fill="#f472b6">dados</tspan><tspan fill="#e9d5ff"> = </tspan><tspan fill="#c4b5fd">extrair_dados</tspan><tspan fill="#e9d5ff">(docx)</tspan></text>
      <text x="28" y="106"><tspan fill="#f472b6">for</tspan><tspan fill="#e9d5ff"> campo </tspan><tspan fill="#f472b6">in</tspan><tspan fill="#e9d5ff"> dados:</tspan></text>
      <text x="48" y="128"><tspan fill="#e9d5ff">form.</tspan><tspan fill="#c4b5fd">preencher</tspan><tspan fill="#e9d5ff">(campo)</tspan></text>
      <text x="28" y="156" fill="#4ade80">✔ 20 campos preenchidos</text>
      <text x="28" y="178" fill="#a78bfa">✨ pronto! confira e envie</text>
    </g>
    <rect x="238" y="166" width="9" height="16" fill="#c4b5fd" opacity=".8"/>
  </g>

  <!-- neon escrito à mão -->
  <g transform="translate(1152 250) rotate(-8)" font-family="'Segoe Script', 'Brush Script MT', cursive" font-size="18" fill="none" stroke="#f0abfc" stroke-width="1.1" filter="url(#neon)" text-anchor="middle">
    <text x="0" y="0">menos</text>
    <text x="0" y="28">trabalho</text>
    <text x="0" y="56">manual</text>
  </g>
</svg>
